name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Install Just
      uses: extractions/setup-just@v2
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Run checks
      run: just check

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Just
      uses: extractions/setup-just@v2
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: just test

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Just
      uses: extractions/setup-just@v2
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: just build
